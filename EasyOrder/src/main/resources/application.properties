spring.application.name=EasyOrder

# Aiven MySQL Connection (Uses placeholders for secure cloud deployment)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&trustServerCertificate=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8080

# CORS configuration (Leave as localhost for now, update once React is deployed)
cors.allowed-origins=http://localhost:3000
